services:
  postgres:
    image: postgres:16
    container_name: product-data-collector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  data-collector:
    image: python:3.12-slim
    container_name: product-data-collector-app
    working_dir: /app
    env_file:
      - .env
    environment:
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DOMEGGOOK_API_KEY_1: ${DOMEGGOOK_API_KEY_1:?DOMEGGOOK_API_KEY_1 is required}
      OWNERCLAN_USERNAME: ${OWNERCLAN_USERNAME:?OWNERCLAN_USERNAME is required}
      OWNERCLAN_PASSWORD: ${OWNERCLAN_PASSWORD:?OWNERCLAN_PASSWORD is required}
      COLLECTOR_LIMIT: ${COLLECTOR_LIMIT:-}
      COLLECTOR_DRY_RUN: ${COLLECTOR_DRY_RUN:-false}
      OWNERCLAN_REFRESH_CATEGORIES: ${OWNERCLAN_REFRESH_CATEGORIES:-true}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && python scripts/test_postgres_connection.py
      && python scripts/run_collectors.py"

volumes:
  postgres_data:
